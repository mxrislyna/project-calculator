<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div id="container"></div>
  
<main>
    <div id="display">0</div>  
    
    <div id="top-btns"></div>
      <div class="del">Del</div>
      <div class="clear">AC</div>
      <div class="power">On/Off</div>
    
    <div id="left-btns"></div>
      <div id="seven">7</div>
      <div id="eight">8</div>
      <div id="nine">9</div>
      <div id="four">4</div>
      <div id="five">5</div>
      <div id="six">6</div>
      <div id="one">1</div>
      <div id="two">2</div>
      <div id="three">3</div>
      <div id="zero">0</div>
      <div id="point">.</div>
      <div id="equals">=</div>

    <div id="right-btns"></div>
      <div id="divide">÷</div>
      <div id="subtract">−</div>
      <div id="multiply">×</div>
      <div id="add">+</div>
</main>



</body>
</html>
